<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruta comercial</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--mut:#6b6760;--line:#e7e3da;--acc:#0f766e;--accbg:#e2f3f1}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 14px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 14px}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.status{font-size:12px;padding:4px 10px;border-radius:99px;background:#ecebe6;color:var(--mut);white-space:nowrap}
.status.ok{background:#e6f4ea;color:#15803d}.status.warn{background:#fff4d6;color:#8a5a00}.status.err{background:#fde8e8;color:#b91c1c}
.week{display:flex;align-items:stretch;gap:5px;margin-bottom:14px}
.wnav{width:24px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--mut)}
.day{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 1px 7px;text-align:center;position:relative}
.day b{display:block;font-size:12px;color:var(--mut)}
.day .dn{display:block;font-size:20px;font-weight:700;line-height:1.2}
.day .dz{display:block;font-size:10px;line-height:1.15;color:var(--mut);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;min-height:23px;letter-spacing:-.25px;font-size:9.5px}
.day.today .dn{color:var(--acc)}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff}
.day.on b,.day.on .dz,.day.on .dn{color:#fff}
.day .cnt{position:absolute;top:-6px;right:-4px;background:#f59e0b;color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:19px;height:19px;line-height:19px;padding:0 5px}
.dtitle{font-size:22px;font-weight:700;letter-spacing:-.01em}
.zchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.zc{font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px}
.sect{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;margin:22px 4px 8px;display:flex;justify-content:space-between;gap:8px}
.subl{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--mut);margin:12px 4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.crow{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px}
.cmain{flex:1;min-width:0;text-align:left}
.nm{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta{font-size:13px;color:var(--mut);margin-top:1px}
.vbtn{padding:8px 11px;border-radius:10px;background:var(--accbg);color:var(--acc);font-weight:700;font-size:13px;white-space:nowrap}
.vbtn.on{background:var(--acc);color:#fff}
.ibtn{width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;color:#b45309}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #cfc9bd;display:grid;place-items:center;flex:none;color:transparent}
.chk.on{background:#16a34a;border-color:#16a34a;color:#fff}
.done .nm{text-decoration:line-through;color:var(--mut)}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:#fef3c7;color:#b45309}
.pill.g{background:#e6f4ea;color:#15803d}
.pill.b{background:#e0ecff;color:#1d4ed8}
.btn.wa.wa2{background:#fff;color:#128C7E;border:1.5px solid #25D366}
.btn.tal{background:#047857;color:#fff}
.talb{background:#047857;color:#fff;border-radius:10px;font-weight:700}
.omini.tal{background:#ecfdf5}
.omini.tal .ohd{color:#047857}
.talbox{background:#ecfdf5;border-color:#a7f3d0}
.chip.npchip.on{background:#b45309;border-color:#b45309;color:#fff}
.chip.talchip.on{background:#047857;border-color:#047857;color:#fff}
.tabs button{max-width:140px}
.ilist{margin:6px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink)}
.ilist li{position:relative;padding:3px 0 3px 18px;border-bottom:1px dotted #eee6d6;line-height:1.35}
.ilist li:last-child{border-bottom:0}
.ilist li:before{content:'';position:absolute;left:4px;top:10px;width:6px;height:6px;border-radius:50%;background:#d97706}
.nextv{font-size:13px;font-weight:600;color:var(--acc);margin-top:2px}
.mlist{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.mi,.madd{display:flex;align-items:center;gap:8px}
.bul{width:24px;height:24px;border-radius:50%;background:#fef3c7;color:#b45309;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.madd .bul{background:var(--accbg);color:var(--acc);font-size:16px}
.miinp,#madd{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font:inherit;font-size:16px;background:#fff}
#madd{border:1.5px dashed #b9d8d4;background:#f7fcfb}
#madd:focus,.miinp:focus{outline:none;border-color:var(--acc);border-style:solid}
.mix{width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--mut);font-size:20px;flex:none}
.maddb{padding:10px 12px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:14px;flex:none}
.lnk{color:var(--acc);font-weight:600;font-size:14px;margin-top:10px}
.btn.ret{background:#c2410c;color:#fff}
.retnote.pen{background:#fef3c7;color:#92400e}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segb{flex:1;min-width:96px;text-align:center;padding:10px 8px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;background:#fff}
.segb.on{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.chip.retchip.on{background:#c2410c;border-color:#c2410c;color:#fff}
.retnote{margin-top:6px;background:#fff1e6;color:#9a3412;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600;white-space:pre-line}
.num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.num.sm{width:22px;height:22px;font-size:12px;background:#ecebe6;color:var(--mut);margin-right:-2px}
.sortbtn{white-space:nowrap;font-size:13px;font-weight:700;color:var(--acc);background:var(--accbg);padding:6px 12px;border-radius:99px;text-transform:none;letter-spacing:0}
.sortbtn.on{background:var(--acc);color:#fff}
.arw{width:44px;height:44px;border-radius:12px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;flex:none}
.arw[disabled]{opacity:.3}
.card.sorting{border-color:var(--acc)}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}

.subl .zc{font-size:12px}
.omini{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding:10px 10px 10px 14px;background:#fffbf4}
.omini:last-child{border-radius:0 0 14px 14px}
.otap{flex:1;min-width:0;text-align:left}
.ohd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#b45309;font-size:13px}
.ohd b{color:var(--ink)}
.ohd svg{width:16px;height:16px}
.dlv{padding:9px 12px;font-size:13px;flex:none}
.track .step{display:flex;align-items:center;gap:12px;padding:8px 0}
.track .step+.step{border-top:1px dashed var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;white-space:nowrap;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.acc{background:var(--acc)}
.btn.wa{background:#25D366;color:#fff}
.btn.waalt{background:#dcfce7;color:#166534;border:1.5px solid #86efac}
.btn.wa.full{white-space:normal;text-align:center;line-height:1.25}
.btn.wa svg{flex:none}
.walbl{display:block;min-width:0}
.wadest{display:block;font-size:13px;font-weight:600;opacity:.92;margin-top:2px;overflow-wrap:anywhere}
.btn.danger{background:#b91c1c;color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:12px 0 0}

.search{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font:inherit;background:var(--card)}
.empty{text-align:center;color:var(--mut);padding:20px 16px;background:var(--card);border-radius:14px;border:1px dashed #d8d3c8;margin-bottom:8px;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--mut);flex:none}
.chev{color:#b3aea4;flex:none}
.topbar{display:flex;align-items:center;gap:10px;margin:4px 0 16px}

.ttl{font-size:21px;font-weight:700;letter-spacing:-.01em;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40}
.tabs button{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:4px 0;position:relative}
.tabs button.on{color:var(--acc)}
.tabs .tb{position:absolute;top:0;left:50%;margin-left:8px;background:#f59e0b;color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.field{margin-bottom:14px}.field>label,.lab{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:6px}

.th{width:84px;height:110px;border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line);background:#fff}
.th img{width:100%;height:100%;object-fit:cover;object-position:top}

.filein{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.pastebox{margin-top:10px;min-height:44px;border:1.5px dashed #d6b48c;border-radius:10px;padding:11px 12px;font-size:13px;color:#b45309;background:#fffaf2;outline:none;caret-color:transparent}

.ocard{display:block;width:100%;text-align:left;padding:12px 14px}
.otext{font-size:14px;color:var(--ink);margin-top:4px;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ai{background:linear-gradient(135deg,#f5f3ff,#ecfeff);border:1px solid #ddd6fe;border-radius:12px;padding:12px;margin-top:10px}
.ai .btn{background:#6d28d9}
.modal-bg{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px 24px;max-height:92vh;overflow:auto}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:20px}}
.mact{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px}
.mact .sp{flex:1}
.imgview{max-width:100%;border-radius:12px;display:block;margin:0 auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.dayset{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dayset:first-of-type{border-top:0}
.dayset .dl{width:82px;font-weight:700;padding-top:7px;flex:none}
.dayset .chip{padding:6px 10px;font-size:13px}
.hint{font-size:13px;color:var(--mut);margin-top:6px}

function fShort(s){var d=pd(s);return d.getDate()+'/'+(d.getMonth()+1);}
function fLong(s){var d=pd(s);return DAYN[d.getDay()]+' '+d.getDate()+' de '+MON[d.getMonth()];}
function fDate(s){var d=pd(s);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();}
function zchip(z){var c=ZC[z]||['#444','#eee'];return '<span class="zc" style="color:'+c[0]+';background:'+c[1]+'">'+esc(z)+'</span>';}
function phoneNorm(p){var d=String(p||'').replace(/\D/g,'');if(d.indexOf('00')===0)d=d.slice(2);if(d.length===9)d='34'+d;return d;}

/* ---------- estado ---------- */
var DEFWEEK={1:['Guadix'],2:['Poniente'],3:['Tabernas','Carboneras'],4:['Níjar y Almería'],5:['Poniente']};
function fixClient(c){if(c.zone==='Adra')c.zone='Poniente';if(c.zone==='Níjar'){c.zone='Níjar y Almería';c.sub=c.sub||'Níjar';}
 var zone=ZONES.indexOf(c.zone)>=0?c.zone:ZONES[0],subs=SUB[zone];
 return {temp:!!c.temp,id:String(c.id||newId('c')),name:String(c.name||'Sin nombre'),zone:zone,sub:subs?(subs.indexOf(c.sub)>=0?c.sub:subs[0]):'',note:String(c.note||''),phone:String(c.phone||'')};}
function fixState(){
 S.clients=(S.clients||[]).map(fixClient);
 var ids={};S.clients.forEach(function(c){ids[c.id]=1;});
 S.visits=(S.visits||[]).filter(function(v){return v&&ids[v.clientId]&&/^\d{4}-\d\d-\d\d$/.test(v.date);}).map(function(v){return {id:String(v.id||newId('v')),clientId:v.clientId,date:v.date,pos:typeof v.pos==='number'?v.pos:null,done:!!v.done,note:String(v.note||'')};});
 S.cheques=(Array.isArray(S.cheques)?S.cheques:[]).filter(function(t){return t&&ids[t.clientId]&&/^\d{4}-\d\d-\d\d$/.test(t.date||'');}).map(function(t){return {id:String(t.id||newId('t')),clientId:t.clientId,date:t.date,amount:parseEur(t.amount),note:String(t.note||''),status:t.status==='recogido'?'recogido':'pendiente',doneAt:t.doneAt||''};});
 S.orders=(S.orders||[]).filter(function(o){return o&&(String(o.text||'').trim()||(o.imgs&&o.imgs.length)||((o.status||'pendiente')==='pendiente'&&o.date>=ymd(new Date())));}).map(function(o){return {id:String(o.id||newId('o')),clientId:o.clientId&&ids[o.clientId]?o.clientId:'',date:o.date||today(),text:String(o.text||''),imgs:Array.isArray(o.imgs)?o.imgs.filter(function(x){return typeof x==='string'&&x.indexOf('data:image/')===0;}):[],status:['enviado','entregado'].indexOf(o.status)>=0?o.status:'pendiente',sentAt:o.sentAt||'',sentTime:o.sentTime||'',deliveredAt:o.deliveredAt||'',deliveredTime:o.deliveredTime||'',forDate:/^\d{4}-\d\d-\d\d$/.test(o.forDate||'')?o.forDate:''};});
 var st=S.settings||{};var wk={};for(var d=1;d<=5;d++){var L=st.week&&Array.isArray(st.week[d])?st.week[d]:DEFWEEK[d];wk[d]=L.filter(function(z){return ZONES.indexOf(z)>=0;});}
 S.settings={wa:String(st.wa||''),waName:String(st.waName||''),plain:!!st.plain,week:wk};}
var S,LS='ruta-comercial-pendiente',pendingLocal=false;
try{S=JSON.parse(document.getElementById('data').textContent);}catch(e){S={rev:0};}
S.rev=+S.rev||0;
try{var pl=JSON.parse(localStorage.getItem(LS)||'null');if(pl&&+pl.rev>S.rev){S=pl;pendingLocal=true;}else localStorage.removeItem(LS);}catch(e){}
fixState();

var V={tab:'dia',v:'dia',date:defDate()},restoreY=0;
try{var nv=JSON.parse(sessionStorage.getItem('ruta-nav')||'null');if(nv&&nv.V){V=nv.V;restoreY=nv.y||0;}}catch(e){}
if(!V.date)V.date=defDate();
function saveNav(){try{sessionStorage.setItem('ruta-nav',JSON.stringify({V:V,y:window.scrollY}));}catch(e){}}

/* ---------- guardado ---------- */
var ART,pubT,status=pendingLocal?'pending':'ok';
function statusHtml(){var m={ok:['ok','✓ Guardado'],pending:['warn','Guardando…'],saving:['warn','Guardando…'],local:['ok','✓ Guardado en el móvil'],ro:['warn','Solo lectura'],error:['err','Error al guardar · reintentar']}[status];
 return '<button id="status" class="status '+m[0]+'" data-act="retry">'+m[1]+'</button>';}
function setStatus(s){status=s;var el=$('#status');if(el)el.outerHTML=statusHtml();}
function initArt(tries){
 if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(a){ART=a||null;if(!ART){if(pendingLocal)setStatus('local');return;}if(pendingLocal){clearTimeout(pubT);pubT=setTimeout(publishNow,600);}},function(){ART=null;if(pendingLocal)setStatus('local');});
  initSample();
 }else{ART=null;if(pendingLocal)setStatus('local');}}
function save(){S.rev++;try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
 if(ART===null){setStatus('local');return;}setStatus('pending');clearTimeout(pubT);pubT=setTimeout(publishNow,1500);}
function commit(){save();render();}
function buildDoc(){
 var css=document.getElementById('css').textContent,app=document.getElementById('app').textContent;
 var data=JSON.stringify(S).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruta comercial</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style id="css">'+css+'</style></head><body><div id="root"></div><script type="application/json" id="data">'+data+'<\/script><script id="app">'+app+'<\/script></body></html>';}
function busy(){var a=document.activeElement;return (a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='file'&&a.type!=='button')))||$('.modal-bg')||aiBusy;}
function publishNow(){
 if(!ART){if(ART===null)setStatus('local');return;}
 if(busy()){pubT=setTimeout(publishNow,1500);return;}
 setStatus('saving');saveNav();
 ART.publish(buildDoc()).then(function(){},function(e){var c=String((e&&(e.code||e.name||e.message))||'');
  if(/not_granted|not_writer/.test(c))setStatus('ro');else if(/conflict/i.test(c)){}else setStatus('error');});}

/* ---------- datos ---------- */
function byId(id){for(var i=0;i<S.clients.length;i++)if(S.clients[i].id===id)return S.clients[i];return null;}
function inZone(z,s){return S.clients.filter(function(c){return (!z||c.zone===z)&&(!s||c.sub===s);});}
function byName(a,b){return a.name.localeCompare(b.name,'es',{sensitivity:'base'});}
function regular(c){return !c.temp;}
function tempPill(c){return c&&c.temp?'<span class="pill" style="background:#ede9fe;color:#6d28d9">Ocasional</span>':'';}
function nCli(n){return n+(n===1?' cliente':' clientes');}
function zonesOf(date){var w=wd(date);return w>=1&&w<=5?S.settings.week[w]||[]:[];}
function visitsOn(date){return S.visits.filter(function(v){return v.date===date;}).sort(function(a,b){var pa=a.pos==null?1e9:a.pos,pb=b.pos==null?1e9:b.pos;return pa-pb||byName(byId(a.clientId),byId(b.clientId));});}
function nextPos(date){var m=-1;S.visits.forEach(function(v){if(v.date===date&&v.pos!=null&&v.pos>m)m=v.pos;});return Math.max(m+1,S.visits.filter(function(v){return v.date===date;}).length);}
function moveVisit(id,dir){var v=vById(id);if(!v)return;var L=visitsOn(v.date);L.forEach(function(x,i){x.pos=i;});var i=L.indexOf(v),j=i+dir;if(j<0||j>=L.length)return;L[i].pos=j;L[j].pos=i;commit();}
function visitFor(cid,date){for(var i=0;i<S.visits.length;i++){var v=S.visits[i];if(v.clientId===cid&&v.date===date)return v;}return null;}
function nextVisit(cid){var d='';S.visits.forEach(function(v){if(v.clientId===cid&&!v.done&&v.date>=today()&&(!d||v.date<d))d=v.date;});return d;}
function lastVisit(cid){var d='';S.visits.forEach(function(v){if(v.clientId===cid&&v.done&&v.date>d)d=v.date;});return d;}
function realOrder(o){return o.text.trim()||o.imgs.length||o.status!=='pendiente';}
function oPill(o){var h=o.status==='pendiente'?'<span class="pill">Por enviar</span>':'<span class="pill b">📤 Enviado'+(o.sentAt?' '+fShort(o.sentAt):'')+'</span>';if(o.status==='entregado')h+='<span class="pill g">✓ Entregado'+(o.deliveredAt?' '+fShort(o.deliveredAt):'')+'</span>';else if(o.status==='enviado')h+='<span class="pill" style="background:#f1f0ec;color:var(--mut)">Sin entregar</span>';return h;}
function due(o){return o.forDate||o.date;}
function activeOrders(cid,upto){return S.orders.filter(function(o){return o.clientId===cid&&o.status!=='entregado'&&realOrder(o)&&(!upto||due(o)<=upto);}).sort(function(a,b){return a.date<b.date?-1:1;});}
function itemsHtml(o){var L=getItems(o);if(!L.length)return o.imgs.length?'<div class="meta" style="margin-top:4px">(ver capturas)</div>':'<div class="meta" style="margin-top:4px;font-style:italic">(sin material)</div>';return '<ul class="ilist">'+L.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';}
function orderMini(o){
 return '<div class="omini"><button class="otap" data-act="order" data-id="'+o.id+'"><div class="ohd">'+I.box+'<b>'+(o.forDate?'Para el '+fShort(o.forDate):'Pedido del '+fShort(o.date))+'</b>'+oPill(o)+(o.imgs.length?'<span class="pill g">📷 '+o.imgs.length+'</span>':'')+'</div>'+itemsHtml(o)+'</button><button class="btn acc dlv" data-act="deliver-o" data-id="'+o.id+'">✓ Entregado</button></div>';}
function minis(cid,upto){return activeOrders(cid,upto).map(orderMini).join('');}
function pendOrders(cid){return S.orders.filter(function(o){return o.status!=='entregado'&&(!cid||o.clientId===cid)&&realOrder(o);}).length;}
function vById(id){for(var i=0;i<S.visits.length;i++)if(S.visits[i].id===id)return S.visits[i];return null;}
function oById(id){for(var i=0;i<S.orders.length;i++)if(S.orders[i].id===id)return S.orders[i];return null;}
function cliLabel(c){return c?c.name+(c.note?' ('+c.note+')':''):'Sin cliente';}
function zoneLabel(c){return c?c.zone+(c.sub?' – '+c.sub:''):'';}
function initials(n){return esc(n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase());}

/* ---------- vistas ---------- */
function render(){
 var h,v=V.v;
 if(v==='pedido'&&oById(V.id))h=vPedido();
 else if(v==='pedidos')h=vPedidos();
 else if(v==='cliente'&&byId(V.id))h=vCliente();
 else if(v==='clientes')h=vClientes();
 else if(v==='ajustes')h=vAjustes();
 else if(v==='talones')h=vTalones();
 else{V.v='dia';V.tab='dia';h=vDia();}
 var np=pendOrders();
 $('#root').innerHTML='<div class="wrap">'+h+'</div><nav class="tabs">'+
  tabBtn('dia','Ruta',I.cal)+tabBtn('pedidos','Pedidos',I.box,np)+tabBtn('talones','Talones',I.cheque,activeCheques().length)+tabBtn('clientes','Clientes',I.users)+tabBtn('ajustes','Ajustes',I.gear)+'</nav>';
 if(V.v==='clientes')renderClientList();
}
function tabBtn(t,l,ic,b){return '<button class="'+(V.tab===t?'on':'')+'" data-act="tab" data-tab="'+t+'">'+ic+l+(b?'<span class="tb">'+b+'</span>':'')+'</button>';}
function topbar(t,back){return '<div class="topbar"><button class="back" data-act="back" aria-label="Volver">'+I.back+'</button><div class="ttl">'+t+'</div><div style="margin-left:auto">'+statusHtml()+'</div></div>';}

function vDia(){
 var d=V.date,mon=monday(d),h='<div class="hdr"><div><h1>Mi ruta</h1><div class="sub">Semana del '+fShort(mon)+' al '+fShort(addDays(mon,4))+(d!==defDate()?' · <button data-act="go-today" style="color:var(--acc);font-weight:700">Ir a hoy</button>':'')+'</div></div>'+statusHtml()+'</div>';
 h+='<div class="week"><button class="wnav" data-act="week" data-n="-7" aria-label="Semana anterior">'+svg('M15 6l-6 6 6 6',18)+'</button>';
 for(var i=0;i<5;i++){var ds=addDays(mon,i),n=visitsOn(ds).filter(function(v){return !v.done;}).length;
  h+='<button class="day'+(ds===d?' on':'')+(ds===today()?' today':'')+'" data-act="date" data-date="'+ds+'"><b>'+DSH[wd(ds)]+'</b><span class="dn">'+pd(ds).getDate()+'</span><span class="dz">'+(zonesOf(ds).map(esc).join('<br>')||'—')+'</span>'+(n?'<span class="cnt">'+n+'</span>':'')+'</button>';}
 h+='<button class="wnav" data-act="week" data-n="7" aria-label="Semana siguiente">'+svg('M9 6l6 6-6 6',18)+'</button></div>';
 var zs=zonesOf(d);
 h+='<div class="dtitle">'+fLong(d)+'</div><div class="zchips">'+(zs.length?zs.map(zchip).join(''):'<span class="meta">Sin zona asignada (cámbialo en Ajustes)</span>')+'</div>';
 var vs=visitsOn(d),done=vs.filter(function(v){return v.done;}).length;
 var so=!!V.sort&&vs.length>1;
 h+='<div class="sect" style="align-items:center"><span>'+(d===today()?'Visitas de hoy':'Visitas programadas')+(vs.length?' · '+done+'/'+vs.length+' hechas':'')+'</span>'+(vs.length>1?'<button class="sortbtn'+(so?' on':'')+'" data-act="sortmode">'+(so?'✓ Listo':'↕ Ordenar')+'</button>':'')+'</div>';
 if(so)h+='<div class="hint" style="margin:-2px 4px 8px">Usa las flechas para poner las visitas en el orden de tu ruta.</div>';
 if(!vs.length)h+='<div class="empty">No tienes visitas programadas para este día.</div>';
 vs.forEach(function(v,idx){var c=byId(v.clientId);
  if(so){h+='<div class="card sorting"><div class="crow"><span class="num">'+(idx+1)+'</span><div class="cmain"><div class="nm">'+esc(c.name)+'</div><div class="meta">'+esc(zoneLabel(c))+(c.note?' · '+esc(c.note):'')+'</div></div><button class="arw" data-act="vmove" data-id="'+v.id+'" data-dir="-1"'+(idx===0?' disabled':'')+' aria-label="Subir">'+svg('M6 15l6-6 6 6',20,2.4)+'</button><button class="arw" data-act="vmove" data-id="'+v.id+'" data-dir="1"'+(idx===vs.length-1?' disabled':'')+' aria-label="Bajar">'+svg('M6 9l6 6 6-6',20,2.4)+'</button></div></div>';return;}
  h+='<div class="card'+(v.done?' done':'')+'"><div class="crow"><span class="num sm">'+(idx+1)+'</span><button class="chk'+(v.done?' on':'')+'" data-act="vdone" data-id="'+v.id+'" aria-label="Hecha">'+I.check+'</button><button class="cmain" data-act="visit" data-id="'+v.id+'"><div class="nm">'+esc(c.name)+tempPill(c)+'</div><div class="meta">'+esc(zoneLabel(c))+(c.note?' · '+esc(c.note):'')+'</div>'+noteHtml(v.note)+'</button><button class="ibtn" data-act="new-order" data-client="'+c.id+'" data-date="'+v.date+'" aria-label="Nuevo pedido">'+I.box+'</button></div>'+minis(c.id,v.date)+talMinis(c.id,v.date)+'</div>';});
 if(!so)h+='<button class="btn acc full" style="margin-top:'+(vs.length?'6':'0')+'px" data-act="picker">'+svg('M12 5v14M5 12h14',18,2.4)+' Añadir visitas a este día</button>';
 return h;}
function clientRow(c,d){var v=visitFor(c.id,d),lv=lastVisit(c.id);
 return '<div class="card"><div class="crow"><button class="cmain" data-act="client" data-id="'+c.id+'"><div class="nm">'+esc(c.name)+'</div><div class="meta">'+(c.note?esc(c.note)+' · ':'')+(lv?'Última visita '+fShort(lv):'Sin visitas')+'</div></button>'+
  '<button class="vbtn'+(v?' on':'')+'" data-act="vtoggle" data-id="'+c.id+'">'+(v?(v.done?'✓ Hecha':'✓ En ruta'):'+ Visita')+'</button><button class="ibtn" data-act="new-order" data-client="'+c.id+'" aria-label="Nuevo pedido">'+I.box+'</button></div>'+(v?'':minis(c.id))+'</div>';}

function vPedidos(){var f=V.f||'activos',qv=norm(V.oq||'').trim();
 if(['activos','entregados','todos'].indexOf(f)<0)f='activos';
 var all=S.orders.filter(realOrder);
 var cnt={activos:all.filter(function(o){return o.status!=='entregado';}).length,entregados:all.filter(function(o){return o.status==='entregado';}).length,todos:all.length};
 var list=all.filter(function(o){return f==='todos'||(f==='entregados'?o.status==='entregado':o.status!=='entregado');});
 if(qv)list=list.filter(function(o){var c=byId(o.clientId);return norm(o.text).indexOf(qv)>=0||(c&&(norm(c.name).indexOf(qv)>=0||norm(c.note).indexOf(qv)>=0))||fDate(o.date).indexOf(qv)>=0;});
 list.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1);});
 var h='<div class="hdr"><div><h1>Pedidos</h1><div class="sub">Se guardan todos para que puedas consultarlos</div></div>'+statusHtml()+'</div>';
 h+='<button class="btn acc full" data-act="new-order">+ Nuevo pedido</button>';
 h+='<div class="chips">'+[['activos','Sin entregar'],['entregados','Entregados'],['todos','Todos']].map(function(x){return '<button class="chip'+(f===x[0]?' on':'')+'" data-act="ofilter" data-f="'+x[0]+'">'+x[1]+'<span>'+cnt[x[0]]+'</span></button>';}).join('')+'</div>';
 h+='<input class="search" id="oq" type="search" style="width:100%;margin:10px 0" placeholder="Buscar cliente, material o fecha (16/11)…" value="'+esc(V.oq||'')+'"><div id="olist">'+orderList(list,f,qv)+'</div>';
 return h;}
function orderList(list,f,qv){var h='';
 if(list.length&&f==='activos'){var groups={},order=[];list.forEach(function(o){var k=o.clientId||'_';if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(o);});
  order.forEach(function(k){var c=byId(k),L=groups[k].sort(function(a,b){return a.date<b.date?-1:1;});
   h+='<div class="card"><div class="crow"><button class="cmain" data-act="'+(c?'client':'order')+'" data-id="'+(c?c.id:L[0].id)+'"><div class="nm">'+esc(c?c.name:'Sin cliente')+tempPill(c)+'</div><div class="meta">'+(c?esc(zoneLabel(c))+(c.note?' · '+esc(c.note):''):'')+'</div></button>'+(c?'<button class="ibtn" data-act="new-order" data-client="'+c.id+'" aria-label="Nuevo pedido">'+svg('M12 5v14M5 12h14',18,2.2)+'</button>':'')+'</div>'+L.map(orderMini).join('')+'</div>';});
  return h;}
 if(!list.length)return '<div class="empty">'+(qv?'Sin resultados.':f==='entregados'?'Aún no hay pedidos entregados.':f==='todos'?'Aún no hay pedidos.':'No tienes pedidos pendientes de entregar.')+'</div>';
 var lastM='';
 list.forEach(function(o){var c=byId(o.clientId),d=pd(o.date),m=MON[d.getMonth()]+' '+d.getFullYear();
  if(f!=='activos'&&m!==lastM){lastM=m;h+='<div class="sect"><span>'+m+'</span></div>';}
  h+='<div class="card"><button class="ocard" data-act="order" data-id="'+o.id+'"><div class="nm">'+esc(c?c.name:'Sin cliente')+tempPill(c)+oPill(o)+(o.imgs.length?'<span class="pill g">📷 '+o.imgs.length+'</span>':'')+'</div><div class="meta">'+(c?esc(zoneLabel(c))+' · ':'')+'Pedido el '+fDate(o.date)+(o.forDate?' · <b>para el '+fShort(o.forDate)+'</b>':'')+'</div>'+itemsHtml(o)+'</button></div>';});
 return h;}
function clientOptions(sel){var h='<option value="">— Elige cliente —</option>';ZONES.forEach(function(z){var L=inZone(z).filter(function(c){return !c.temp||c.id===sel;}).sort(byName);if(!L.length)return;h+='<optgroup label="'+esc(z)+'">'+L.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+(c.temp?' (ocasional)':'')+(c.sub?' ('+esc(c.sub)+')':'')+(c.note?' · '+esc(c.note):'')+'</option>';}).join('')+'</optgroup>';});return h;}
function vPedido(){var o=oById(V.id),c=byId(o.clientId),sent=o.status!=='pendiente',dlv=o.status==='entregado';

function copyText(t,ta){try{navigator.clipboard.writeText(t).then(function(){toast('Copiado');},function(){if(ta)ta.select();toast('No se pudo copiar');});}catch(er){if(ta)ta.select();toast('No se pudo copiar');}}
var txT;
document.addEventListener('input',function(e){var t=e.target;
 if(t.id==='q'){V.q=t.value;saveNav();renderClientList();}
 else if(t.id==='pq'){renderPicker();}
 else if(t.id==='oq'){V.oq=t.value;saveNav();var ol=$('#olist');if(ol){var x=document.createElement('div');x.innerHTML=vPedidos();var n=x.querySelector('#olist');if(n)ol.innerHTML=n.innerHTML;}}
 else if(t.classList&&t.classList.contains('miinp')){var om2=curOrder();if(om2&&t.value.trim()){var L2=getItems(om2);L2[+t.dataset.i]=t.value;setItems(om2,L2);}}
 else if(t.id==='otx'){var o=curOrder();if(o){o.text=t.value;var a=$('[data-act=wa-send]');if(a)a.href=waLink(o);clearTimeout(txT);txT=setTimeout(save,700);}}});
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='ocl'){var o=curOrder();if(o){o.clientId=t.value;if(o.clientId&&(!o.forDate||o.status==='pendiente'&&!realOrder(o)))o.forDate=defFor(o.clientId);commit();}}
 else if(t.id==='ofd'){var of=curOrder();if(of){of.forDate=t.value||'';var msg='';if(realOrder(of)&&ensureVisit(of.clientId,of.forDate))msg='Visita añadida el '+fShort(of.forDate);commit();if(msg)toast(msg);}}
 else if(t.id==='otx'){var o2=curOrder();if(o2){o2.text=t.value;clearTimeout(txT);save();render();}}
 else if(t.id==='ofile'){addFiles(t.files);t.value='';}
 else if(t.id==='oscan'){addFiles(t.files,true);t.value='';}
 else if(t.id==='rf'){var f=t.files&&t.files[0];if(!f)return;var r=new FileReader();r.onload=function(){readBackup(String(r.result||''));};r.onerror=function(){toast('No se pudo leer el archivo');};r.readAsText(f);}
 else if(t.id==='swa'){S.settings.wa=phoneNorm(t.value);commit();}
 else if(t.id==='swn'){S.settings.waName=t.value.trim();save();}
 else if(t.id==='splain'){S.settings.plain=t.checked;commit();}});
document.addEventListener('paste',function(e){if(V.v!=='pedido')return;var pt=e.target;if(pt&&pt.id==='madd'){var tx2=e.clipboardData&&e.clipboardData.getData('text');if(tx2&&/\n/.test(tx2.trim())){e.preventDefault();addItems(tx2);pt.value='';return;}}var cd=e.clipboardData,imgs=[];if(cd){[].forEach.call(cd.files||[],function(f){if(/^image\//.test(f.type))imgs.push(f);});if(!imgs.length&&cd.items)[].forEach.call(cd.items,function(i){if(i.kind==='file'&&/^image\//.test(i.type)){var f=i.getAsFile();if(f)imgs.push(f);}});}
 if(imgs.length){e.preventDefault();addFiles(imgs);}else if(pt&&pt.id==='pbox'){e.preventDefault();toast('No hay ninguna imagen copiada. Copia la captura primero');}});
document.addEventListener('input',function(e){var t=e.target;if(t&&t.id==='pbox'){var im=t.querySelector('img');if(im&&/^data:image\//.test(im.src)){addFiles([d2b(im.src)]);}t.innerHTML='';}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();
 if(e.key==='Enter'&&!e.isComposing){var t=e.target;if(t.id==='madd'){e.preventDefault();if(t.value.trim()){addItems(t.value);t.value='';}t.focus();}
  else if(t.classList&&t.classList.contains('miinp')){e.preventDefault();if(!t.value.trim()){var o=curOrder();if(o){var L=getItems(o);L.splice(+t.dataset.i,1);setItems(o,L);renderMList();}}var m=$('#madd');if(m)m.focus();}}});
document.addEventListener('focusout',function(e){var t=e.target;if(t.classList&&t.classList.contains('miinp')&&!t.value.trim()){var o=curOrder();if(o){var L=getItems(o);L.splice(+t.dataset.i,1);setItems(o,L);setTimeout(renderMList,0);}}});

if(restoreY)requestAnimationFrame(function(){window.scrollTo(0,restoreY);});
initArt(0);
