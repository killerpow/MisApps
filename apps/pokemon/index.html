<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi colección Pokémon TCG (inglés)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d1b26; --muted:#6b6878; --line:#e4dfd3;
  --red:#e3350d; --red-d:#b8290a; --gold:#f5b700; --ok:#1f9d55; --ok-soft:#dff3e6;
  --tile:#ffffff; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14131a; --panel:#1e1c26; --ink:#f2f0f7; --muted:#a19dae; --line:#2f2c3a;
    --tile:#24222e; --ok-soft:#173726; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 80px}
header.top{position:relative;overflow:hidden;background:linear-gradient(135deg,#c4260a,var(--red) 40%,#ff7a3d);color:#fff;padding:18px 14px 20px;border-radius:0 0 22px 22px;box-shadow:0 6px 24px rgba(227,53,13,.25)}
header.top .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (max-width:600px){header.top .art{opacity:.7}}
header.top .in{position:relative;max-width:980px;margin:0 auto;text-shadow:0 1px 6px rgba(80,10,0,.35)}
.holo{animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:.15}50%{opacity:.45}}
.twinkle{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.holo,.twinkle{animation:none}}
.ico{width:38px;height:38px;flex:0 0 38px;display:block}
.setrow{grid-template-columns:auto 1fr auto !important}
.setrow .bar{grid-column:2/-1 !important}
.sethead .ico{width:44px;height:44px;flex-basis:44px}
h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.sub{opacity:.9;font-size:13px;font-weight:700;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(110,18,0,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.stat span{font-size:11px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.4px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd54a);border-radius:99px;transition:width .3s}
.top .bar{background:rgba(255,255,255,.25);margin-top:12px;height:10px}
.toolbar{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;outline:0;background:transparent;padding:11px 6px;width:100%;font-weight:700}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:7px 10px;font-size:13px;border-radius:10px}
.status{font-size:12px;font-weight:800;color:var(--muted);margin:4px 2px 8px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--gold)} .dot.warn{background:var(--red)}
details.series{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);margin:10px 0;overflow:hidden}
details.series>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px}
details.series>summary::-webkit-details-marker{display:none}
.chev{transition:transform .2s;color:var(--muted);font-weight:900}
details[open] .chev{transform:rotate(90deg)}
.sname{font-weight:900;font-size:16px;flex:1}
.scount{font-size:12px;font-weight:800;color:var(--muted)}
.sbar{width:70px}
.setlist{border-top:1.5px solid var(--line)}
.setrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.setrow:last-child{border-bottom:0}
.setrow:hover{background:rgba(127,127,127,.06)}
.setrow .nm{font-weight:800;font-size:15px}
.setrow .dt{font-size:12px;color:var(--muted);font-weight:700}
.setrow .ct{font-weight:900;font-size:13px;text-align:right}
.setrow .bar{grid-column:1/-1;height:6px}
.setrow.done .ct{color:var(--ok)}
.setrow.done .bar>i{background:var(--ok)}
.badge{display:inline-block;font-size:10px;font-weight:900;background:var(--ok);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
/* set view */
.sethead{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1.5px solid var(--line)}
.sethead .row{display:flex;align-items:center;gap:10px}
.sethead h2{margin:0;font-size:20px;font-weight:900;flex:1;line-height:1.15}
.sethead .meta{font-size:12px;color:var(--muted);font-weight:800;margin:4px 0 8px}
.seg{display:inline-flex;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-top:10px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:14px}
.tile{position:relative;aspect-ratio:63/88;border-radius:9px;border:2px dashed var(--line);background:var(--tile);display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;user-select:none;font-weight:900;transition:transform .08s}
.tile:active{transform:scale(.94)}
.tile .n{font-size:15px;letter-spacing:-.3px}
.tile .n.long{font-size:12px}
.tile .of{font-size:9px;color:var(--muted);font-weight:800;margin-top:2px}
.tile.own{border:2px solid var(--ok);background:linear-gradient(160deg,var(--ok-soft),var(--tile))}
.tile.own::after{content:"✓";position:absolute;top:3px;right:5px;font-size:13px;color:var(--ok);font-weight:900}
.tile.secret .of{color:var(--gold)}
.quick{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.quick input{flex:1;min-width:160px;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px;font-weight:700;outline:0}
.hint{font-size:12px;color:var(--muted);font-weight:700;margin-top:8px}
.empty{text-align:center;color:var(--muted);font-weight:800;padding:40px 10px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,8,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.modal.show{display:flex}
.sheet{background:var(--panel);border-radius:18px;padding:18px;width:100%;max-width:520px;max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-weight:900}
.sheet p{margin:6px 0 12px;color:var(--muted);font-weight:700;font-size:14px}
.sheet textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);font-family:ui-monospace,monospace;font-size:12px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;transition:transform .25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
/* fotos */
.icobtn{border:0;background:none;padding:0;cursor:pointer;display:block;border-radius:10px;flex:0 0 auto}
.ico.photo{object-fit:cover;border-radius:10px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tile .more{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:7px;border:0;background:rgba(127,127,127,.14);font-size:12px;font-weight:900;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);z-index:2}
.tile .tph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px}
.tile.hasph .n,.tile.hasph .of{position:relative;z-index:1;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 4px}
.tile.hasph{justify-content:flex-end;padding-bottom:4px}
.tile.hasph::after{z-index:2;background:#fff;border-radius:50%;width:16px;height:16px;line-height:16px;text-align:center;font-size:11px}
.tile.hasph .more{background:rgba(255,255,255,.85)}
.snack{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:var(--bg);padding:10px 10px 10px 14px;border-radius:14px;font-weight:800;font-size:14px;display:flex;gap:8px;align-items:center;z-index:55;transition:transform .25s;width:max-content;max-width:94vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.snack.show{transform:translateX(-50%) translateY(0)}
.snack button,.snack a{border:0;background:var(--red);color:#fff;border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.snack a{background:rgba(127,127,127,.35);color:inherit}
.preview{width:100%;max-height:46vh;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:14px;margin:8px 0 12px;overflow:hidden;min-height:150px}
.preview img{max-width:100%;max-height:46vh;display:block}
.preview .ph0{font-size:42px;font-weight:900;color:var(--muted);padding:30px}
.btncol{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btncol .full{grid-column:1/-1}
a.btn{text-decoration:none;text-align:center;display:block}
.btn.danger{color:var(--red);border-color:var(--red)}
.busyov{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:800;padding:8px}
@media (min-width:700px){ .grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))} h1{font-size:26px} }
</style>
</head>

  </svg>
  <div class="in">
    <h1><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="5" y="2" width="16" height="22" rx="3" fill="#fff" opacity=".55" transform="rotate(-10 13 13)"/><rect x="8" y="4" width="16" height="22" rx="3" fill="#fff"/><circle cx="16" cy="15" r="4" fill="#f5b700"/></svg>Mi colección Pokémon TCG</h1>

</header>

function initials(name){
  if(OVR[name]) return OVR[name];
  if(/Trainer Gallery/.test(name)) return "TG";
  const n=name.replace(/^HS—/,"");
  const num=n.match(/\d+/g);
  if(/^\d+$/.test(n.trim())) return n.trim();
  let w=n.split(/[\s:—\-]+/).filter(x=>x&&!STOP.has(x.toLowerCase())&&!/^\d+$/.test(x));
  if(/Black Star Promos/.test(name)) return "PR";
  if(/Trainer Kit/.test(name)) return "TK";
  if(/Energies/.test(name)) return "EN";
  let s=w.length===1? w[0].slice(0,2) : w.slice(0,3).map(x=>x[0]).join("");
  if(num&&/POP|McDonald|Celebration/.test(name)) s=(w[0]||"")[0]+num[num.length-1].slice(-2);
  return s.toUpperCase().replace(/[^A-Z0-9É]/g,"").slice(0,3)||"?";
}

function iconSvg(s){
  const [c1,c2,shape]=ERA[s.series]||["#555","#aaa","circle"];
  const t=initials(s.name), g="g"+s.id.replace(/[^a-z0-9]/g,"");
  const fs=t.length>=3?(shape==="star"?8:10.5):(shape==="star"?10:13);

  <path d="${shapePath(shape)}" fill="url(#${g})" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <path d="${shapePath(shape)}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1" transform="translate(20 20) scale(.8) translate(-20 -20)"/>
  <text x="20" y="${ty}" text-anchor="middle" font-family="Nunito,system-ui,sans-serif" font-weight="900" font-size="${fs}" fill="#fff" style="paint-order:stroke" stroke="rgba(0,0,0,.25)" stroke-width="1.2">${t}</text></svg>`;

}

function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open("ptcg-fotos",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);});}
function tx(db,mode,fn){return new Promise((ok,ko)=>{const t=db.transaction("f",mode),st=t.objectStore("f");const res=fn(st);t.oncomplete=()=>ok(res&&res.result);t.onerror=()=>ko(t.error);});}
(async()=>{
  try{
    const db=await idb();
    await new Promise(ok=>{const t=db.transaction("f","readonly"),st=t.objectStore("f"),c=st.openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){URLS[cur.key]=URL.createObjectURL(cur.value);cur.continue();}else ok();};c.onerror=()=>ok();});
    assets={
      upload:async blob=>{const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await tx(db,"readwrite",st=>st.put(blob,id));URLS[id]=URL.createObjectURL(blob);return {id};},
      delete:async id=>{await tx(db,"readwrite",st=>st.delete(id));if(URLS[id]){URL.revokeObjectURL(URLS[id]);delete URLS[id];}}
    };
    for(const k in icoCache) delete icoCache[k];
    render(true);
  }catch(e){setStatus("warn","Guardado en este móvil (sin fotos)");}
})();

  if(id===current) return;
  current=id; filter="all";
  try{ if(id) location.hash="set-"+id; else if(location.hash) history.replaceState?history.replaceState(null,"",location.pathname+location.search):(location.hash="home"); }catch(e){}
  render(false);
}
window.addEventListener("hashchange",()=>{const x=hashSet();if(x!==current){current=x;filter="all";render(false);}});

/* ---------- Fotos ---------- */
let snackT;
function snack(s,n){
  const el=document.getElementById("snack");
  el.innerHTML=`<span>✓ ${esc(label(s,n))} conseguida</span><button id="snPh">📷 Foto</button><a href="${webLink(s,n)}">🔍 Ver</a>`;
  el.classList.add("show");
  document.getElementById("snPh").onclick=()=>{hideSnack();openCard(s,n);};
  clearTimeout(snackT); snackT=setTimeout(hideSnack,6000);
}
function hideSnack(){document.getElementById("snack").classList.remove("show");}
function pickImage(useCam){
  return new Promise(res=>{
    const inp=document.getElementById(useCam?"fCam":"fGal"); inp.value="";
    inp.onchange=()=>res(inp.files&&inp.files[0]||null); inp.click();
  });
}
async function shrink(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(b=>ok(b||file),"image/jpeg",.85));
  }catch(e){return file;} finally{URL.revokeObjectURL(url);}
}
async function uploadPhoto(file,max){
  if(!assets) throw new Error("noassets");
  const blob=await shrink(file,max);
  const r=await assets.upload(blob); return r.id;
}
function dropAsset(id){if(assets&&id) assets.delete(id).catch(()=>{});}
function removeCardPhoto(s,n){
  const id=photos[s.id]&&photos[s.id][n]; if(!id) return;
  delete photos[s.id][n]; if(!Object.keys(photos[s.id]).length) delete photos[s.id];
  dropAsset(id); changed(s.id);
}
function noPhotosMsg(){return assets?"":`<p>⚠️ No se pueden guardar fotos en este móvil.</p>`;}

function openCard(s,n){
  hideSnack();
  const has=owned[s.id].has(n), ph=photos[s.id]&&photos[s.id][n]&&src(photos[s.id][n]), lb=label(s,n);
  sheet.innerHTML=`<h3>${esc(s.name)} · ${esc(lb)}${s.printed?" / "+s.printed:""}</h3>
    <div class="preview">${ph?`<img src="${ph}" alt="Foto de la carta">`:`<div class="ph0">${esc(lb)}</div>`}</div>
    ${has?noPhotosMsg():`<p>Márcala como conseguida para poder añadirle tu foto.</p>`}
    <div class="btncol">
      ${has?`<button class="btn primary" id="cCam">📷 Hacer foto</button><button class="btn" id="cGal">🖼️ Elegir imagen</button>`:`<button class="btn primary full" id="cOwn">✓ La tengo</button>`}
      <a class="btn" href="${webLink(s,n)}">🔍 Ver la carta</a><button class="btn" id="cCopy">🔗 Copiar enlace</button>
      ${ph?`<button class="btn danger" id="cDel">Quitar foto</button>`:""}
      ${has?`<button class="btn ${ph?"":"full"}" id="cUnown">Desmarcar</button>`:""}
      <button class="btn full" id="cClose">Cerrar</button>
    </div><div id="cBusy"></div>`;
  modal.classList.add("show");
  const $=id=>document.getElementById(id);
  $("cClose").onclick=close;
  $("cCopy").onclick=async()=>{try{await navigator.clipboard.writeText(webLink(s,n));toast("Enlace copiado: pégalo en tu navegador");}catch(e){showText("Enlace de la carta",webLink(s,n));}};
  const redraw=()=>{refreshTile(s,n);const c2=cnt(s);const sc=document.getElementById("setc");if(sc){sc.textContent=`${c2}/${s.total} (${pct(c2,s.total)}%)`;document.getElementById("setbar").style.width=c2*100/s.total+"%";}updateTop();};
  if($("cOwn")) $("cOwn").onclick=()=>{owned[s.id].add(n);changed(s.id);redraw();openCard(s,n);};
  if($("cUnown")) $("cUnown").onclick=()=>{removeCardPhoto(s,n);owned[s.id].delete(n);changed(s.id);if(filter==="have"){const t=document.querySelector(`.tile[data-n="${n}"]`);if(t)t.remove();}redraw();close();};
  if($("cDel")) $("cDel").onclick=()=>{removeCardPhoto(s,n);redraw();openCard(s,n);};
  const doPick=async cam=>{
    const f=await pickImage(cam); if(!f) return;
    $("cBusy").innerHTML=`<div class="busyov">Guardando foto…</div>`;
    try{
      const id=await uploadPhoto(f,1000); const old=photos[s.id]&&photos[s.id][n];
      (photos[s.id]=photos[s.id]||{})[n]=id; if(old) dropAsset(old);
      changed(s.id); redraw(); openCard(s,n); toast("Foto guardada");
    }catch(e){$("cBusy").innerHTML=`<div class="busyov">No se pudo guardar la foto.</div>`;}
  };
  if($("cCam")) $("cCam").onclick=()=>doPick(true);
  if($("cGal")) $("cGal").onclick=()=>doPick(false);
}

function openCover(s){
  hideSnack();
  const cv=covers[s.id]&&src(covers[s.id]);
  sheet.innerHTML=`<h3>Foto de ${esc(s.name)}</h3>
    <div class="preview">${cv?`<img src="${cv}" alt="Foto de la colección">`:`<div style="transform:scale(2.4);padding:40px">${iconSvg(s)}</div>`}</div>
    ${noPhotosMsg()}
    <div class="btncol">
      <button class="btn primary" id="vCam">📷 Hacer foto</button><button class="btn" id="vGal">🖼️ Elegir imagen</button>
      ${cv?`<button class="btn danger full" id="vDel">Quitar foto y volver al icono</button>`:""}
      <button class="btn full" id="vClose">Cerrar</button>
    </div><div id="vBusy"></div>`;
  modal.classList.add("show");
  const $=id=>document.getElementById(id);
  $("vClose").onclick=close;
  const refresh=()=>{delete icoCache[s.id];render(true);};
  if($("vDel")) $("vDel").onclick=()=>{const old=covers[s.id];delete covers[s.id];dropAsset(old);changed(s.id);refresh();openCover(s);};
  const doPick=async cam=>{
    const f=await pickImage(cam); if(!f) return;
    $("vBusy").innerHTML=`<div class="busyov">Guardando foto…</div>`;
    try{
      const id=await uploadPhoto(f,600); const old=covers[s.id];
      covers[s.id]=id; if(old) dropAsset(old);
      changed(s.id); refresh(); openCover(s); toast("Foto de la colección guardada");
    }catch(e){$("vBusy").innerHTML=`<div class="busyov">No se pudo guardar la foto.</div>`;}
  };
  $("vCam").onclick=()=>doPick(true); $("vGal").onclick=()=>doPick(false);
}

/* ---------- Modales ---------- */
const modal=document.getElementById("modal"), sheet=document.getElementById("sheet");
function close(){modal.classList.remove("show");}
modal.onclick=e=>{if(e.target===modal)close();};
function confirmBox(msg,ok){
  sheet.innerHTML=`<h3>${esc(msg)}</h3><div class="acts"><button class="btn" id="mNo">Cancelar</button><button class="btn primary" id="mYes">Sí</button></div>`;
  modal.classList.add("show");
  document.getElementById("mNo").onclick=close; document.getElementById("mYes").onclick=()=>{close();ok();};
}
function showText(title,txt){
  sheet.innerHTML=`<h3>${esc(title)}</h3><textarea readonly>${esc(txt)}</textarea><div class="acts"><button class="btn primary" id="mNo">Cerrar</button></div>`;
  modal.classList.add("show"); document.getElementById("mNo").onclick=close;
}
function openBackup(){
  const o={};for(const k in owned) if(owned[k].size) o[k]=[...owned[k]].sort((a,b)=>a-b);
  const txt=JSON.stringify(o);
  sheet.innerHTML=`<h3>Copia de seguridad</h3>
    <p>Guarda la copia en el móvil o cópiala. Para restaurar, pega el texto abajo y pulsa «Importar». (Las fotos no van en la copia.)</p>
    <textarea id="bk">${esc(txt)}</textarea>
    <div class="acts"><button class="btn" id="mSave">Guardar archivo</button><button class="btn" id="mCopy">Copiar</button><button class="btn" id="mImp">Importar</button><button class="btn primary" id="mNo">Cerrar</button></div>`;
  modal.classList.add("show");
  document.getElementById("mNo").onclick=close;
  document.getElementById("mSave").onclick=()=>{if(window.androidSaveFile){const d=new Date();window.androidSaveFile("pokemon-copia-"+d.toISOString().slice(0,10)+".json",document.getElementById("bk").value);}else toast("No disponible aquí");};
  document.getElementById("mCopy").onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById("bk").value);toast("Copiado");}catch(e){toast("Selecciona el texto y cópialo a mano");}};
  document.getElementById("mImp").onclick=()=>{
    try{
      const o2=JSON.parse(document.getElementById("bk").value); let n=0;
      for(const k in o2){ if(!BYID[k]||!Array.isArray(o2[k])) continue; owned[k]=new Set(o2[k].filter(x=>Number.isInteger(x)&&x>=1&&x<=BYID[k].total)); changed(k); n++; }
      close(); render(false); toast(`Importadas ${n} colecciones`);
    }catch(e){toast("El texto no es una copia válida");}
  };
}
let toastT;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2200);}

render(false);
</script>
