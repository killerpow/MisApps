.reccard{display:flex;align-items:center;gap:12px;width:100%;margin-top:4px}

.spsegs{display:flex;gap:2px;height:8px;border-radius:9px;overflow:hidden}.spsegs i{display:block;height:100%}
.sprow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}.sprow:first-child{border-top:0}.sprow b{flex:1;font-weight:600}.sprow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.resbar{display:flex;gap:3px;margin-top:6px}.resbar i{flex:1;max-width:18px;height:10px;border-radius:3px;background:var(--card2)}
.spdays{display:flex;gap:6px}.spdays button{flex:1;height:40px;border-radius:12px;background:var(--card2);font-weight:700}.spdays button.on{background:#5b8def;color:#fff}
.wd.spin i{box-shadow:inset 0 0 0 2px #5b8def}
.spinhero{background:linear-gradient(135deg,#2f4fd1 0%,#5b8def 60%,#7fb2ff 100%);color:#fff}
.spinhero .btn.dark{background:#0d1640}
.actbtn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px}
.actbtn b{font-size:14px}
.sportgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sportgrid button{background:var(--card);border-radius:12px;padding:9px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent}
.sportgrid button span{font-size:22px}
.sportgrid button.on{border-color:var(--acc);background:rgba(255,91,31,.1)}
.stepbar{display:block;height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:6px 0 4px}.stepbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));border-radius:9px}
.stepchart{display:flex;gap:6px;margin:12px 0 8px}
.stepchart .bw{position:relative;display:flex;align-items:flex-end;justify-content:center;height:90px;width:100%}
.stepchart .gl{position:absolute;left:-3px;right:-3px;border-top:1.5px dashed var(--ok);opacity:.55}
.stepchart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.stepchart i{display:block;width:100%;max-width:26px;border-radius:6px 6px 2px 2px;min-height:2px}
.stepchart small{font-size:11px;color:var(--mut)}.stepchart .v{font-size:10px;color:var(--mut)}
.posbadge{position:absolute;right:10px;top:10px;font-weight:800;font-size:13px;padding:5px 10px;border-radius:99px;transition:all .2s}
.posbadge.up{background:#ffb21f;color:#140800;transform:scale(1.08)}
.posbadge.down{background:rgba(255,255,255,.08);color:var(--mut)}
.sharegrid{display:flex;gap:8px;flex-wrap:wrap}.sharegrid .btn{flex:1;text-decoration:none}
.wa{background:#25d366!important;color:#06210f!important}
.vis{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:20px;padding:12px 16px;margin:8px 0}
/* sheet */
#sh{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:none}
#sh.on{display:block}
#sh .bg{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.6)}
#sh .pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#12161b;border-radius:24px 24px 0 0;padding:20px 18px calc(var(--sb) + 20px);max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 14px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 14px;margin-bottom:10px}
.search input{flex:1;background:none;border:0;color:var(--txt);padding:13px 0;outline:none}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--card);font-size:13px;font-weight:600}
.pill.on{background:var(--acc);color:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:14px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--card2);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:21px}
.macro{margin-bottom:10px}
.macro .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.macro .b{height:8px;background:var(--card2);border-radius:9px;overflow:hidden}
.macro .b i{display:block;height:100%;border-radius:9px}
.meal{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px}
.meal .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.meal .h .t{flex:1}
.meal .h small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.meal .h b{display:block;font-size:16px}
.meal ul{margin:0;padding-left:18px;color:#cfd4db;font-size:14px}
.meal .mm{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--mut);margin-top:8px}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.glasses button{width:34px;height:40px;border-radius:9px;background:var(--card2);font-size:18px;display:grid;place-items:center}
.glasses button.on{background:#1f6fff}
.hist{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.hist .ic{width:38px;height:38px;border-radius:12px;background:rgba(47,210,122,.12);display:grid;place-items:center}
.hist .t{flex:1}
.hist small{color:var(--mut)}
.addw{display:flex;gap:8px;margin-top:12px}
.addw .inp{flex:1;display:flex;align-items:center;background:var(--card2);border-radius:12px;padding:0 12px}
.addw input{flex:1;background:none;border:0;color:var(--txt);padding:10px 0;outline:none;font-weight:600;width:100%}
.confirm p{margin:6px 0 16px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 90px);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .2s}
.empty{text-align:center;color:var(--mut);padding:20px 10px;font-size:14px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span{color:var(--mut)}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
</style>
</head>
