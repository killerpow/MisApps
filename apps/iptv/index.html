<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor IPTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#2a2f3a;--txt:#e9ecf2;--mut:#8f97a8;
  --acc:#4f8cff;--ok:#2fbf71;--warn:#f0a43a;--bad:#ef5b5b;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:-.2px}
header h1 span{color:var(--acc)}
main{max-width:820px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#12151b;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:820px;width:100%}
nav button{flex:1;background:none;border:0;padding:10px 4px 12px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
.banner{background:#2b2312;border:1px solid #5a4415;color:#f4cf8a;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px}
.banner.err{background:#2b1515;border-color:#5a2222;color:#f4a3a3}
.row{display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid.k4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mut);font-size:11px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
h2{font-size:14px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin:22px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{color:var(--mut);font-size:13px;margin-top:2px}
.item .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .amt small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:rgba(47,191,113,.14);color:var(--ok)}
.p-warn{background:rgba(240,164,58,.15);color:var(--warn)}
.p-bad{background:rgba(239,91,91,.15);color:var(--bad)}
.p-mut{background:#262a33;color:var(--mut)}
.btn{background:var(--acc);border:0;color:#fff;padding:10px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid #5a2a2a}
.btn:disabled{opacity:.5}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.fab{position:fixed;right:18px;bottom:84px;z-index:6;width:54px;height:54px;border-radius:50%;background:var(--acc);border:0;color:#fff;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.4);cursor:pointer}
.search{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 12px;padding-bottom:2px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:12px}
.monthbar b{text-transform:capitalize}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.ov{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 22px;border:1px solid var(--line)}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet h3{margin:0 0 14px;font-size:18px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--acc)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.cred{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cred .k{font-size:11px;color:var(--mut)}
.cred .val{font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all}
.cred .grow{flex:1;min-width:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kv span{display:block;font-size:11px;color:var(--mut)}
.kv b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a2f3a;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.mv{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:0}
.mv .dot{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;flex:none}
.in-dot{background:rgba(47,191,113,.14);color:var(--ok)}
.out-dot{background:rgba(239,91,91,.14);color:var(--bad)}
textarea.backup{width:100%;height:160px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}
.loading{color:var(--mut);text-align:center;padding:40px}
a.wa{color:var(--ok);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>Gestor <span>IPTV</span></h1>
  <button class="iconbtn" id="btnSettings" aria-label="Ajustes">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>
<main id="app"><div class="loading">Cargando datos…</div></main>
<button class="fab" id="fab" aria-label="Añadir">+</button>
<nav><div class="in">
  <button data-tab="resumen" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Resumen</button>
  <button data-tab="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M1 21c0-4 4-6 8-6s8 2 8 6"/><path d="M17 4a4 4 0 0 1 0 8M23 21c0-3-2-5-5-5.6"/></svg>Clientes</button>
  <button data-tab="proveedores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Proveedores</button>
  <button data-tab="movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>Movimientos</button>
</div></nav>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Number(n)||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseD = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtD = s => { const d=parseD(s); return d ? d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}) : '—'; };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
function addMonths(s, n, anchorDay){
  const d=parseD(s); const day=anchorDay||d.getDate();
  const t=new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  t.setDate(Math.min(day,last)); return toStr(t);
}
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const FREQ = {1:'Mensual',2:'Bimestral',3:'Trimestral',6:'Semestral',12:'Anual'};
const freqTxt = f => FREQ[f] || `Cada ${f} meses`;
function toast(msg){ const t=$('#toast'); t.style.pointerEvents='none'; t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function actionToast(msg,label,fn){
  const t=$('#toast'); t.innerHTML=''; t.style.pointerEvents='auto';
  const s=document.createElement('span'); s.textContent=msg+'  ';
  const b=document.createElement('button'); b.textContent=label; b.className='btn sm'; b.style.marginLeft='8px';
  b.onclick=()=>{ t.classList.remove('on'); t.style.pointerEvents='none'; fn(); };
  t.append(s,b); t.classList.add('on'); clearTimeout(t._h);
  t._h=setTimeout(()=>{ t.classList.remove('on'); t.style.pointerEvents='none'; },7000);
}
/* Anula un cobro/pago y devuelve la fecha del próximo vencimiento a la anterior */
function undoMove(mid){
  const m=S.items[mid]; if(!m) return;
  const ref=m.ref&&S.items[m.ref];
  if(ref){
    const upd={...ref}; let ch=false;
    if(m.newNext && ref.next===m.newNext){ upd.next=m.prevNext||''; ch=true; }
    if(m.debtPaid){ upd.debt=r2(debtOf(upd)+Number(m.debtPaid)); if(!upd.debtNote&&m.prevDebtNote) upd.debtNote=m.prevDebtNote; ch=true; }
    if(m.debtAdded){ upd.debt=r2(Math.max(0,debtOf(upd)-Number(m.debtAdded))); ch=true; }
    if(ch) save(upd);
  }
  remove(mid);
}
function askUndo(mid){
  const m=S.items[mid]; if(!m) return;
  const ref=m.ref&&S.items[m.ref];
  const back=ref && m.newNext && ref.next===m.newNext;
  confirmBox(`¿Anular ${m.type==='in'?'este cobro':'este pago'}?`,
    `${m.label} · ${fmt(m.amount)} · ${fmtD(m.date)}.` + (back?` La fecha del próximo ${m.type==='in'?'cobro':'pago'} volverá al ${fmtD(m.prevNext)}.`:'')
      + (m.debtPaid&&ref?` Lo que debe volverá a subir ${fmt(m.debtPaid)}.`:'') + (m.debtAdded&&ref?` Se quitarán ${fmt(m.debtAdded)} de lo que debe.`:''),
    ()=>{ undoMove(mid); toast('Anulado'); closeModal(); }, 'Anular');
}
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Copiado'); }
  catch(e){ toast('No se pudo copiar: mantén pulsado el texto'); }
}

/* ============ Almacenamiento ============ */
const S = { items:{}, mode:'loading', uid:null, col:null, writes:{}, error:null };
const LS_KEY='iptv-manager-v1';
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S.items)); }catch(e){} }

async function initStore(){
  let loaded=false;
  const timer=setTimeout(()=>{ if(!loaded){ S.error='Los datos tardan en llegar. Comprueba tu conexión.'; render(); } },10000);
  try{
    const db = await claude.use('db');
    const user = await claude.use('user');
    const id = user ? await user.id() : null;
    if(db && id){
      S.uid=id; S.col=db.collection('data/users/'+id); S.mode='cloud';
      S.col.onSnapshot(snap=>{
        const it={}; snap.docs.forEach(d=>{ if(d.exists) it[d.id]={...d.data(), id:d.id}; });
        S.items=it;
        if(!snap.metadata.fromCache){ loaded=true; clearTimeout(timer); S.error=null; }
        render();
      }, err=>{ loaded=true; clearTimeout(timer); S.error='No se pudo conectar con la base de datos ('+err.code+').'; render(); });
      return;
    }
  }catch(e){}
  clearTimeout(timer); loaded=true;
  S.mode='local'; S.items=lsLoad(); render();
}
function save(obj){
  const o={...obj}; S.items[o.id]=o;
  if(S.mode==='cloud'){
    const id=o.id; const body={...o}; delete body.id;
    const prev=S.writes[id]||Promise.resolve();
    S.writes[id]=prev.then(()=>S.col.doc(id).set(body)).catch(e=>{ toast(e&&e.code==='quota_exceeded'?'Base de datos llena':'Error al guardar'); });
  } else lsSave();
  render();
}
function remove(id){
  delete S.items[id];
  if(S.mode==='cloud'){
    const prev=S.writes[id]||Promise.resolve();
    S.writes[id]=prev.then(()=>S.col.doc(id).delete()).catch(()=>toast('Error al borrar'));
  } else lsSave();
  render();
}
const all = kind => Object.values(S.items).filter(x=>x.kind===kind);
const clients = () => all('client').sort((a,b)=>a.name.localeCompare(b.name,'es'));
const providers = () => all('provider').sort((a,b)=>a.name.localeCompare(b.name,'es'));
const moves = () => all('move').sort((a,b)=> b.date.localeCompare(a.date) || (b.created||0)-(a.created||0));

/* ============ Lógica ============ */
function status(nextDate, active=true){
  if(!active) return {cls:'p-mut',txt:'Inactivo',rank:9};
  if(!nextDate) return {cls:'p-mut',txt:'Sin fecha',rank:8};
  const d=daysBetween(todayStr(), nextDate);
  if(d<0) return {cls:'p-bad',txt:`Vencido ${-d} d`,rank:0,days:d};
  if(d===0) return {cls:'p-warn',txt:'Hoy',rank:1,days:d};
  if(d<=5) return {cls:'p-warn',txt:`En ${d} d`,rank:2,days:d};
  return {cls:'p-ok',txt:'Al día',rank:3,days:d};
}
const provName = id => (S.items[id]&&S.items[id].name) || 'Sin proveedor';
const r2=n=>Math.round((Number(n)||0)*100)/100;
const debtOf=c=>Number(c.debt)||0;
const isLate=(c,t=todayStr())=>c.active!==false&&((c.next&&c.next<t)||debtOf(c)>0);
function monthly(c){ const f=Number(c.freq)||1; return {inc:(Number(c.price)||0)/f, cost:(Number(c.cost)||0)/f}; }

/* ============ Navegación ============ */
let tab='resumen'; let monthOff=0; let cFilter='todos'; let cQuery=''; let mFilter='todos';
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); window.scrollTo(0,0); render(); });
$('#fab').onclick=()=>{ if(tab==='proveedores') providerForm(); else if(tab==='movimientos') moveForm(); else clientForm(); };
$('#btnSettings').onclick=settings;

function selMonth(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+monthOff); return d; }
function monthKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function monthBar(){
  const d=selMonth(); const name=d.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  return `<div class="monthbar"><button class="iconbtn" data-m="-1">‹</button><b>${esc(name)}</b><button class="iconbtn" data-m="1">›</button></div>`;
}
function bindMonth(){ document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ monthOff+=Number(b.dataset.m); render(); }); }

/* ============ Render ============ */
function render(){
  const app=$('#app');
  if(S.mode==='loading'){ app.innerHTML='<div class="loading">Cargando datos…</div>'; return; }
  let h='';
  if(S.error) h+=`<div class="banner err">${esc(S.error)}</div>`;
  let seen=false; try{ seen=localStorage.getItem('iptv-aviso-visto')==='1'; }catch(e){}
  if(S.mode==='local' && !seen && !S.bannerClosed) h+=`<div class="banner row"><div style="flex:1">Los datos se guardan en este móvil. Haz copias de seguridad desde Ajustes ⚙️.</div><button class="btn sm ghost" id="bannerOk">Entendido</button></div>`;
  if(tab==='resumen') h+=viewResumen();
  if(tab==='clientes') h+=viewClientes();
  if(tab==='proveedores') h+=viewProveedores();
  if(tab==='movimientos') h+=viewMovimientos();
  app.innerHTML=h;
  bindMonth();
  document.querySelectorAll('[data-client]').forEach(e=>e.onclick=()=>clientDetail(e.dataset.client));
  document.querySelectorAll('[data-prov]').forEach(e=>e.onclick=()=>providerDetail(e.dataset.prov));
  document.querySelectorAll('[data-pay]').forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); payForm(e.dataset.pay); });
  document.querySelectorAll('[data-paydebt]').forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); debtPayForm(e.dataset.paydebt); });
  document.querySelectorAll('[data-delmove]').forEach(e=>e.onclick=()=>askUndo(e.dataset.delmove));
  const sq=$('#cSearch'); if(sq){ sq.oninput=()=>{ cQuery=sq.value; const pos=sq.selectionStart; render(); const n=$('#cSearch'); n.focus(); n.setSelectionRange(pos,pos); }; }
  document.querySelectorAll('[data-cf]').forEach(e=>e.onclick=()=>{ cFilter=e.dataset.cf; render(); });
  document.querySelectorAll('[data-mf]').forEach(e=>e.onclick=()=>{ mFilter=e.dataset.mf; render(); });
  const go=$('#goAdd'); if(go) go.onclick=()=>clientForm();
  const bo=$('#bannerOk'); if(bo) bo.onclick=()=>{ S.bannerClosed=true; try{ localStorage.setItem('iptv-aviso-visto','1'); }catch(e){} render(); };
}

function viewResumen(){
  const cs=clients(), act=cs.filter(c=>c.active!==false);
  let inc=0,cost=0; act.forEach(c=>{ const m=monthly(c); inc+=m.inc; cost+=m.cost; });
  const mk=monthKey(selMonth());
  const mm=moves().filter(m=>m.date.startsWith(mk));
  const cob=mm.filter(m=>m.type==='in').reduce((s,m)=>s+Number(m.amount),0);
  const pag=mm.filter(m=>m.type==='out').reduce((s,m)=>s+Number(m.amount),0);
  const ben=cob-pag;

  // Pendientes: vencidos + próximos 7 días
  const t=todayStr();
  const dueC=act.filter(c=>c.next && daysBetween(t,c.next)<=7).sort((a,b)=>a.next.localeCompare(b.next));
  const dueP=providers().filter(p=>p.active!==false && p.next && daysBetween(t,p.next)<=7).sort((a,b)=>a.next.localeCompare(b.next));
  const overdue=act.filter(c=>c.next && c.next<t);
  const debtors=act.filter(c=>debtOf(c)>0).sort((a,b)=>debtOf(b)-debtOf(a));
  const debtSum=debtors.reduce((s,c)=>s+debtOf(c),0);
  const overAmt=overdue.reduce((s,c)=>s+Number(c.price||0),0)+debtSum;

  let h=monthBar();
  h+=`<div class="grid k4">

  if(debtors.length){

  }
  h+=`<h2>Pagos a proveedores · próximos 7 días</h2>`;

  dueP.forEach(p=>{ const st=status(p.next);
    h+=`<div class="card item" data-prov="${p.id}"><div class="main"><div class="t">${esc(p.name)}</div><div class="d">${fmtD(p.next)} · <span class="pill ${st.cls}">${st.txt}</span></div></div>
    <div class="amt">${fmt(p.amount)}</div><button class="btn sm" data-pay="${p.id}">Pagar</button></div>`; });

  if(!cs.length) h+=`<div class="card empty" style="margin-top:16px">Aún no tienes clientes.<br><br><button class="btn" id="goAdd">Añadir el primero</button></div>`;
  return h;
}

function viewClientes(){
  let cs=clients(); const t=todayStr();
  const q=cQuery.trim().toLowerCase();
  if(q) cs=cs.filter(c=>[c.name,c.user,c.phone,c.notes,provName(c.provider)].join(' ').toLowerCase().includes(q));
  const counts={todos:cs.length, atrasados:cs.filter(c=>isLate(c,t)).length, activos:cs.filter(c=>c.active!==false).length, inactivos:cs.filter(c=>c.active===false).length};
  if(cFilter==='atrasados') cs=cs.filter(c=>isLate(c,t));
  if(cFilter==='activos') cs=cs.filter(c=>c.active!==false);
  if(cFilter==='inactivos') cs=cs.filter(c=>c.active===false);
  cs.sort((a,b)=>status(a.next,a.active!==false).rank-status(b.next,b.active!==false).rank || (a.next||'').localeCompare(b.next||''));
  let h=`<div class="row"><input id="cSearch" class="search" placeholder="Buscar por nombre, usuario, teléfono…" value="${esc(cQuery)}"></div>
  <div class="chips">${['todos','activos','atrasados','inactivos'].map(k=>`<button class="chip ${cFilter===k?'on':''}" data-cf="${k}">${k[0].toUpperCase()+k.slice(1)} (${counts[k]})</button>`).join('')}</div>`;
  if(!cs.length) h+=`<div class="card empty">${clients().length?'Ningún cliente coincide.':'Pulsa + para añadir tu primer cliente.'}</div>`;
  cs.forEach(c=>{ const st=status(c.next,c.active!==false); const m=(Number(c.price)||0)-(Number(c.cost)||0);
    h+=`<div class="card item" data-client="${c.id}"><div class="main"><div class="t">${esc(c.name)}</div>
      <div class="d"><span class="pill ${st.cls}">${st.txt}</span>${debtOf(c)>0?` <span class="pill p-bad">Debe ${fmt(debtOf(c))}</span>`:''} · ${c.next?fmtD(c.next):'—'} · ${esc(provName(c.provider))}</div></div>
      <div class="amt">${fmt(c.price)}<small>${freqTxt(c.freq)} · <span class="${m>=0?'pos':'neg'}">${m>=0?'+':''}${fmt(m)}</span></small></div></div>`; });
  return h;
}

function viewProveedores(){

function viewMovimientos(){
  const mk=monthKey(selMonth());
  let mm=moves().filter(m=>m.date.startsWith(mk));
  const tin=mm.filter(m=>m.type==='in').reduce((s,m)=>s+Number(m.amount),0);
  const tout=mm.filter(m=>m.type==='out').reduce((s,m)=>s+Number(m.amount),0);
  if(mFilter==='in') mm=mm.filter(m=>m.type==='in');
  if(mFilter==='out') mm=mm.filter(m=>m.type==='out');
  let h=monthBar();
  h+=`<div class="grid"><div class="kpi"><div class="l">Entradas</div><div class="v pos">${fmt(tin)}</div></div><div class="kpi"><div class="l">Salidas</div><div class="v neg">${fmt(tout)}</div></div></div>`;
  h+=`<div class="chips">${[['todos','Todos'],['in','Cobros'],['out','Pagos']].map(([k,l])=>`<button class="chip ${mFilter===k?'on':''}" data-mf="${k}">${l}</button>`).join('')}</div>`;
  if(!mm.length) return h+`<div class="card empty">Sin movimientos este mes.</div>`;
  h+=`<div class="card">`;
  mm.forEach(m=>{ h+=`<div class="mv"><div class="dot ${m.type==='in'?'in-dot':'out-dot'}">${m.type==='in'?'↓':'↑'}</div>
    <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(m.label)}</div><div class="hint" style="margin:0">${fmtD(m.date)}${m.note?' · '+esc(m.note):''}</div></div>
    <div style="font-weight:600" class="${m.type==='in'?'pos':'neg'}">${m.type==='in'?'+':'−'}${fmt(m.amount)}</div>

  return h+`</div>`;
}

/* ============ Modales ============ */
function openModal(html, onMount){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="ov"><div class="sheet">${html}</div></div>`;
  const ov=root.firstChild;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  root.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>askUndo(b.dataset.undo));
  onMount && onMount(root);
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function confirmBox(title,msg,onYes,yesTxt='Eliminar'){
  openModal(`<h3>${esc(title)}</h3><p style="color:var(--mut);margin:0">${esc(msg)}</p><div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn bad" id="yes">${esc(yesTxt)}</button></div>`,
    r=>{ r.querySelector('#yes').onclick=()=>{ closeModal(); onYes(); }; });
}

  openModal(`<h3>${isC?'Registrar cobro':'Registrar pago'} · ${esc(x.name)}</h3>
  <div class="f2">
    <div class="f"><label>Importe (€)</label><input id="amount" inputmode="decimal" value="${isC?(x.price??''):(x.amount??'')}"></div>
    <div class="f"><label>Fecha</label><input id="date" type="date" value="${todayStr()}"></div>
  </div>
  <div class="f"><label>Nota (opcional)</label><input id="note" placeholder="${isC?'Bizum, efectivo, transferencia…':'Método de pago…'}"></div>
  <div class="f"><label><input type="checkbox" id="adv" checked style="width:auto;margin-right:6px">Pasar ${isC?'el próximo cobro':'el próximo pago'} al <b>${fmtD(newNext)}</b></label></div>
  ${isC?`<div class="f" id="shortWrap" style="display:none"><label><input type="checkbox" id="addDebt" checked style="width:auto;margin-right:6px">Paga menos: sumar lo que falta (<b id="shortAmt"></b>) a lo que debe</label></div>`:''}
  <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn ${isC?'ok':''}" id="ok">Guardar</button></div>`,
  r=>{
    const short=()=>isC?r2((Number(x.price)||0)-num(r,'amount')):0;
    if(isC){ const upd=()=>{ const sh=short(); r.querySelector('#shortWrap').style.display=sh>0?'':'none'; r.querySelector('#shortAmt').textContent=fmt(sh); };
      r.querySelector('#amount').oninput=upd; upd(); }
    r.querySelector('#ok').onclick=()=>{
      const amount=num(r,'amount'); const date=val(r,'date')||todayStr();
      const adv=r.querySelector('#adv').checked && newNext;
      const mid=uid('m');
      const sh=short(); const debtAdded=(isC&&sh>0&&r.querySelector('#addDebt').checked)?sh:0;
      save({id:mid,kind:'move',type:isC?'in':'out',ref:id,label:(isC?'Cobro · ':'Pago · ')+x.name,amount,date,note:val(r,'note'),created:Date.now(),
        prevNext:x.next||'', newNext:adv?newNext:'', debtAdded});
      if(adv||debtAdded) save({...x, next:adv?newNext:x.next, debt:r2(debtOf(x)+debtAdded)});
      closeModal(); actionToast((isC?'Cobro registrado · ':'Pago registrado · ')+x.name,'Deshacer',()=>{ undoMove(mid); toast('Anulado'); }); };
  });
}
function debtPayForm(id){
  const x=S.items[id]; if(!x) return; const d=debtOf(x);
  openModal(`<h3>Cobrar atraso · ${esc(x.name)}</h3>
  <p class="hint" style="font-size:13px">Debe <b class="neg">${fmt(d)}</b>${x.debtNote?' · '+esc(x.debtNote):''}. Puedes cobrarlo entero o solo una parte.</p>
  <div class="f2">
    <div class="f"><label>Importe que paga (€)</label><input id="amount" inputmode="decimal" value="${d}"></div>
    <div class="f"><label>Fecha</label><input id="date" type="date" value="${todayStr()}"></div>
  </div>
  <div class="f"><label>Nota (opcional)</label><input id="note" placeholder="Bizum, efectivo…"></div>
  <div class="hint" id="rest"></div>
  <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn ok" id="ok">Guardar</button></div>`,
  r=>{ const upd=()=>{ const left=r2(d-num(r,'amount')); r.querySelector('#rest').textContent= left>0?`Seguirá debiendo ${fmt(left)}.`:'Queda al día con los atrasos.'; };
    r.querySelector('#amount').oninput=upd; upd();
    r.querySelector('#ok').onclick=()=>{
      const amount=num(r,'amount'); if(amount<=0){ toast('Pon un importe'); return; }
      const paid=Math.min(amount,d); const mid=uid('m');
      save({id:mid,kind:'move',type:'in',ref:id,label:'Cobro atraso · '+x.name,amount,date:val(r,'date')||todayStr(),note:val(r,'note'),created:Date.now(),debtPaid:r2(paid),prevDebtNote:x.debtNote||''});
      save({...x,debt:r2(d-paid), debtNote: d-paid>0?x.debtNote:''});
      closeModal(); actionToast('Atraso cobrado · '+x.name,'Deshacer',()=>{ undoMove(mid); toast('Anulado'); }); };
  });
}
function moveForm(){
  openModal(`<h3>Movimiento manual</h3>
  <div class="f"><label>Tipo</label><select id="type"><option value="out">Gasto / pago</option><option value="in">Ingreso / cobro</option></select></div>
  <div class="f"><label>Concepto *</label><input id="label" placeholder="Ej.: créditos extra, panel, alta nueva…"></div>
  <div class="f2"><div class="f"><label>Importe (€)</label><input id="amount" inputmode="decimal"></div><div class="f"><label>Fecha</label><input id="date" type="date" value="${todayStr()}"></div></div>
  <div class="f"><label>Nota</label><input id="note"></div>
  <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="ok">Guardar</button></div>`,
  r=>{ r.querySelector('#ok').onclick=()=>{ const label=val(r,'label'); if(!label){ toast('Pon un concepto'); return; }
      save({id:uid('m'),kind:'move',type:val(r,'type'),ref:'',label,amount:num(r,'amount'),date:val(r,'date')||todayStr(),note:val(r,'note'),created:Date.now()});
      closeModal(); toast('Movimiento guardado'); }; });
}

/* --- Ajustes / copia de seguridad --- */
function settings(){
  const data=JSON.stringify(Object.values(S.items));
  openModal(`<h3>Ajustes</h3>
  <p class="hint" style="font-size:13px">${S.mode==='cloud'?'✅ Tus datos se guardan en tu cuenta y son privados: solo tú los ves, aunque compartas esta página.':'📱 Los datos se guardan en este móvil. Haz copias de seguridad de vez en cuando.'}</p>
  <h2>Copia de seguridad</h2>
  <p class="hint">Guarda el archivo en un lugar seguro: contiene las contraseñas de tus clientes.</p>
  <div class="row" style="flex-wrap:wrap">
    <button class="btn sm" id="dl">⬇️ Descargar archivo de copia</button>
    <button class="btn ghost sm" id="cp">Copiar como texto</button>
  </div>
  <div class="hint" id="dlInfo"></div>
  <h2>Restaurar</h2>
  <p class="hint">Elige un archivo de copia (o pega el texto). Se añade a los datos actuales; si un registro ya existe, se sobrescribe.</p>
  <div class="f"><input type="file" id="file" accept=".json,application/json,text/plain"></div>
  <textarea class="backup" id="imp" placeholder='…o pega aquí el texto de la copia'></textarea>
  <div class="actions"><button class="btn ghost" data-close>Cerrar</button><button class="btn" id="doimp">Importar texto</button></div>`,
  r=>{ r.querySelector('#cp').onclick=()=>copy(data);
    const dlb=r.querySelector('#dl');
    dlb.onclick=async()=>{
      const fname=`copia-iptv-${todayStr()}.json`, fdata=JSON.stringify(Object.values(S.items),null,1);
      const dls=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads').catch(()=>null):null;
      if(!dls){
        try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([fdata],{type:'application/json'})); a.download=fname;
          document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); toast('Copia descargada'); }
        catch(e){ r.querySelector('#dlInfo').textContent='La descarga no está disponible aquí; usa "Copiar como texto".'; }
        return;
      }
      try{ await dls.save({filename:fname, data:fdata}); toast('Copia guardada'); }
      catch(e){ if(e&&e.code==='declined') return; r.querySelector('#dlInfo').textContent='No se pudo descargar ('+(e&&e.code||'error')+'). Usa "Copiar como texto".'; }
    };
    const doImport=txt=>{
      let arr; try{ arr=JSON.parse(txt); }catch(e){ toast('El archivo o texto no es válido'); return; }
      if(!Array.isArray(arr)){ toast('Formato no válido'); return; }
      let n=0; arr.forEach(o=>{ if(o&&o.id&&o.kind&&/^[\w\-.~:@+]+$/.test(o.id)){ save(o); n++; } });
      closeModal(); toast(`${n} registros importados`);
    };
    r.querySelector('#file').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(doImport).catch(()=>toast('No se pudo leer el archivo')); };
    r.querySelector('#doimp').onclick=()=>doImport(r.querySelector('#imp').value);
  });
}

/* ============ Arranque ============ */
initStore();
</script>
