name: Compilar apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar apps
        run: python3 preparar.py
      - name: Preparar firma (si existe el secreto)
        env:
          FIRMA_B64: ${{ secrets.FIRMA_B64 }}
        run: if [ -n "$FIRMA_B64" ]; then echo "$FIRMA_B64" | base64 -d > firma.jks; echo "Firma fija"; else echo "Sin firma fija"; fi
      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          FIRMA_PASS: ${{ secrets.FIRMA_PASS }}
        run: gradle assembleDebug --no-daemon
      - name: Reunir APKs
        run: |
          mkdir salida
          for f in app/build/outputs/apk/*/debug/*.apk; do
            id=$(basename "$(dirname "$(dirname "$f")")")
            cp "$f" "salida/$id.apk"
          done
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: MisApps
          path: salida/*.apk
      - name: Publicar por separado las apps que han cambiado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in salida/*.apk; do
            id=$(basename "$f" .apk)
            # "Huella" de todo lo que forma la app: si no cambia, no se publica versión nueva
            h=$(find "apps/$id" "app/src/$id" app/src/main app/build.gradle -type f | sort | xargs sha256sum | sha256sum | cut -c1-16)
            tag=$(gh release list --limit 300 --json tagName,name -q ".[] | select(.name | startswith(\"$id v\")) | .tagName" | head -1)
            old=""
            if [ -n "$tag" ]; then old=$(gh release view "$tag" --json body -q .body | grep -o 'huella: [0-9a-f]*' | cut -d' ' -f2); fi
            if [ "$h" != "$old" ]; then
              gh release create "$id-v${{ github.run_number }}" "$f" --title "$id v${{ github.run_number }}" --notes "huella: $h" --latest=false
              echo "$id: versión nueva"
            else
              echo "$id: sin cambios"
            fi
          done
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mis apps v${{ github.run_number }}
          make_latest: true
          files: salida/*.apk
