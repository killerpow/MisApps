import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// Lista de apps: se genera una app instalable por cada entrada de apps.json
def APPS = new JsonSlurper().parse(rootProject.file('apps.json'))
// Solo compilar las apps que ya tienen su página preparada
APPS = APPS.findAll { rootProject.file("apps/${it.id}/index.html").exists() }

android {
    namespace 'com.juanmi.apps'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1." + (System.getenv('VERSION_CODE') ?: '0')
    }



    flavorDimensions 'app'
    productFlavors {
        APPS.each { a ->
            create(a.id) {
                dimension 'app'
                applicationId "com.juanmi.${a.id}"
                resValue 'string', 'app_name', a.name
                resValue 'color', 'app_color', a.color
            }
        }
    }

    // Firma fija: solo si GitHub tiene guardado el secreto FIRMA_B64 (así las
    // actualizaciones se instalan encima sin borrar los datos)
    def firma = rootProject.file('firma.jks')
    if (firma.exists()) {
        signingConfigs {
            fija {
                storeFile firma
                storePassword System.getenv('FIRMA_PASS')
                keyAlias 'apps'
                keyPassword System.getenv('FIRMA_PASS')
            }
        }
        buildTypes {
            debug { signingConfig signingConfigs.fija }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Escáner de documentos de Google, solo para Mis Décimos
    loteriaImplementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
}
